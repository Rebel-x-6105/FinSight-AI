<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="FinSight AI - Intelligent personal finance and spending analytics platform."
    >

    <title>
        {% block title %}
        FinSight AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- Navigation -->
    <header class="site-header">

        <nav class="navbar container">

            <!-- Brand -->
            <a
                href="{{ url_for('home') }}"
                class="brand"
            >
                <span class="brand-icon">F</span>

                <span class="brand-name">
                    FinSight AI
                </span>
            </a>


            <!-- Navigation Links -->
            <div class="nav-links">

                <a href="{{ url_for('home') }}">
                    Home
                </a>

                <a href="{{ url_for('dashboard') }}">
                    Dashboard
                </a>

                <a href="{{ url_for('about') }}">
                    About
                </a>

                <a href="{{ url_for('login') }}">
                    Login
                </a>

                <a
                    href="{{ url_for('register') }}"
                    class="nav-register"
                >
                    Register
                </a>

            </div>

        </nav>

    </header>


    <!-- Page-specific content -->
    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="container footer-content">

            <div>

                <h3>
                    FinSight AI
                </h3>

                <p>
                    Understand your money.
                    Make smarter financial decisions.
                </p>

            </div>

            <p class="copyright">
                © 2026 FinSight AI
            </p>

        </div>

    </footer>

</body>

</html>
